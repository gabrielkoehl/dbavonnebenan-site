baseURL = "https://dbavonnebenan.de/"   # override with --baseURL for preview deployments
title = "DBA von Nebenan"
theme = "PaperMod"

defaultContentLanguage = "de"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableGitInfo = true
enableEmoji = false
capitalizeListTitles = false   # keep tag spelling as written
ignoreFiles = ['\.obsidian', '\.canvas$']   # keep Obsidian metadata out of the build

[pagination]
  pagerSize = 10

# Keep old article URLs: /<slug>/ instead of /posts/<slug>/
[permalinks.page]
  posts = "/:slug/"

# Explicit lastmod (imported articles) wins over the git commit date
[frontmatter]
  lastmod = ["lastmod", ":git", "date"]

[outputs]
  home = ["HTML", "RSS", "JSON"]   # JSON feeds the PaperMod search

[markup.highlight]
  noClasses = false   # use CSS classes from the theme
  lineNos = false
  guessSyntax = false

# allows {.layout} below a table for a borderless layout table
[markup.goldmark.parser.attribute]
  block = true

[markup.goldmark.renderer]
  unsafe = false

[params]
  env = "production"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowShareButtons = false
  comments = false
  disableSpecial1stPost = true

  [params.cover]
    hiddenInSingle = true   # cover only in lists, articles start with the TOC

  [params.assets]
    favicon = "brand/favicon.png"
    favicon16x16 = "brand/favicon-32x32.png"
    favicon32x32 = "brand/favicon-32x32.png"
    apple_touch_icon = "brand/apple-touch-icon.png"

  [params.label]
    text = "DBA von Nebenan"   # hidden via CSS, kept as link title
    icon = "brand/logo.png"    # static file, pre-sized to 3x iconHeight
    iconHeight = 80

  # site verification (values taken from the live site head)
  [params.analytics.google]
    SiteVerificationTag = "v5tYngBsjJHNV_q24JH2dv7uNtkgdKx1QdSQ0mIdbWw"
  [params.analytics.bing]
    SiteVerificationTag = "938f6c1e7ac08d7ea209c43c65b6a3a4"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

# Language: German (default)
